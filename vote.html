        // ==========================================
        // 1. 初始化網頁
        // ==========================================
        window.onload = function() {
            initVoterDropdown();
            initVoteCards();
            checkAndParseUrl(); // 偵測是否有後綴網址，以便進行教師解析
        }

        // 初始化學生座號下拉選單
        function initVoterDropdown() {
            const selector = document.getElementById('studentSelector');
            studentsData.forEach(student => {
                const opt = document.createElement('option');
                opt.value = student.seatNo;
                opt.textContent = `[座號 ${student.seatNo}] ${student.name}`;
                selector.appendChild(opt);
            });
        }

        // 生成 32 張 4*8 的投票卡片
        function initVoteCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            studentsData.forEach(student => {
                const card = document.createElement('div');
                card.id = `card-${student.seatNo}`;
                card.className = 'card-item border border-slate-200 bg-white rounded-lg p-4 flex items-center justify-between shadow-sm transition-all duration-200 select-none cursor-pointer hover:border-indigo-300';
                
                // 點擊卡片任何地方都能選取，除非是自己的卡片被禁用
                card.setAttribute('onclick', `toggleVote('${student.seatNo}')`);

                let badgeColor = "bg-slate-100 text-slate-700";
                let typeText = "其他";
                if(student.type === "web") { badgeColor = "bg-emerald-50 text-emerald-700 border border-emerald-200"; typeText = "網頁"; }
                else if(student.type === "canvas") { badgeColor = "bg-blue-50 text-blue-700 border border-blue-200"; typeText = "Canvas"; }
                else if(student.type === "extension") { badgeColor = "bg-amber-50 text-amber-700 border border-amber-200"; typeText = "外掛"; }

                card.innerHTML = `
                    <div class="flex items-center space-x-3 flex-grow pr-2">
                        <!-- 座號標籤 -->
                        <div class="shrink-0 w-8 h-8 rounded-full bg-slate-100 text-slate-700 font-bold text-xs flex items-center justify-center border border-slate-200">
                            ${student.seatNo}
                        </div>
                        <!-- 學姓名與專案名稱 -->
                        <div class="min-w-0 flex-grow">
                            <div class="flex items-center gap-1.5 mb-0.5">
                                <span class="font-bold text-slate-800 text-sm truncate max-w-[80px]">${student.name}</span>
                                <span class="text-[10px] px-1.5 py-0.2 rounded font-semibold ${badgeColor}">${typeText}</span>
                            </div>
                            <h4 class="text-xs text-slate-500 font-medium line-clamp-1">${student.title}</h4>
                        </div>
                    </div>
                    <!-- 大大的核取方塊 -->
                    <div class="shrink-0 flex items-center justify-center">
                        <input type="checkbox" id="check-${student.seatNo}" value="${student.seatNo}" 
                               class="w-5 h-5 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500 pointer-events-none"
                               onclick="event.stopPropagation(); toggleVote('${student.seatNo}');">
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ==========================================
        // 2. 身份變更與防呆處理
        // ==========================================
        function onVoterChanged() {
            const selector = document.getElementById('studentSelector');
            currentVoter = selector.value;

            // 1. 先重設所有卡片的鎖定狀態
            studentsData.forEach(student => {
                const card = document.getElementById(`card-${student.seatNo}`);
                const checkbox = document.getElementById(`check-${student.seatNo}`);
                
                card.classList.remove('opacity-40', 'bg-slate-50', 'pointer-events-none', 'border-rose-200');
                checkbox.disabled = false;
            });

            // 2. 如果投票者選擇了自己的座號，則鎖定他自己的那張卡片 (不可自投)
            if (currentVoter) {
                const selfCard = document.getElementById(`card-${currentVoter}`);
                const selfCheckbox = document.getElementById(`check-${currentVoter}`);
                
                // 如果本來有勾選自己，強制取消勾選
                if (selectedVotes.includes(currentVoter)) {
                    selectedVotes = selectedVotes.filter(v => v !== currentVoter);
                    selfCheckbox.checked = false;
                }

                // 將該卡片渲染為不可選取樣式
                selfCard.classList.add('opacity-40', 'bg-slate-50', 'pointer-events-none');
                selfCheckbox.disabled = true;
                
                showToast(`已鎖定座號 ${currentVoter}，你不能投給自己喔！`, "fa-solid fa-triangle-exclamation text-rose-500");
            }

            // 3. 重新整理整體介面的核取限制
            updateCheckboxStates();
            updateVoteCount();
            generateUrl();
        }

        // ==========================================
        // 3. 投票與狀態更新
        // ==========================================
        function toggleVote(seatNo) {
            // 防呆：必須先填入身份才能投票
            if (!currentVoter) {
                showToast("請先在第一步確認你的座號身份！", "fa-solid fa-user-xmark text-amber-500");
                document.getElementById('studentSelector').focus();
                return;
            }

            // 防呆：不能投給自己
            if (seatNo === currentVoter) {
                return;
            }

            const checkbox = document.getElementById(`check-${seatNo}`);
            const card = document.getElementById(`card-${seatNo}`);
            const index = selectedVotes.indexOf(seatNo);

            if (index > -1) {
                // 原本有勾，現在取消勾選
                selectedVotes.splice(index, 1);
                checkbox.checked = false;
                card.classList.remove('bg-indigo-50/50', 'border-indigo-400', 'ring-1', 'ring-indigo-400');
            } else {
                // 原本沒勾，嘗試勾選
                if (selectedVotes.length >= 16) {
                    showToast("每人最多隻能投 16 票喔！", "fa-solid fa-circle-exclamation text-amber-500");
                    return;
                }
                selectedVotes.push(seatNo);
                checkbox.checked = true;
                card.classList.add('bg-indigo-50/50', 'border-indigo-400', 'ring-1', 'ring-indigo-400');
            }

            updateCheckboxStates();
            updateVoteCount();
            generateUrl();
        }

        // 當達到 16 票限制時，鎖定其他未勾選的卡片；未滿 16 票則解鎖
        function updateCheckboxStates() {
            const maxReached = selectedVotes.length >= 16;
            
            studentsData.forEach(student => {
                // 略過自投鎖定的那張卡片
                if (student.seatNo === currentVoter) return;

                const card = document.getElementById(`card-${student.seatNo}`);
                const checkbox = document.getElementById(`check-${student.seatNo}`);
                
                if (maxReached && !selectedVotes.includes(student.seatNo)) {
                    card.classList.add('opacity-40', 'pointer-events-none');
                    checkbox.disabled = true;
                } else {
                    card.classList.remove('opacity-40', 'pointer-events-none');
                    checkbox.disabled = false;
                }
            });
        }

        // 更新投票計數
        function updateVoteCount() {
            document.getElementById('voteCountBadge').textContent = selectedVotes.length;
        }

        // ==========================================
        // 4. 生成二進位並壓縮為一個 10 進位整數（核心編解碼設計）
        // ==========================================
        function generateUrl() {
            const urlInput = document.getElementById('generatedUrl');
            
            if (!currentVoter) {
                urlInput.value = "";
                urlInput.placeholder = "請先選擇座號並開始投票...";
                return;
            }

            const base = window.location.origin + window.location.pathname;
            
            // 💡 32-bit Bitmask 編碼法：
            // 將每一個勾選的座號 (1~32) 對應到二進位的位元 index (0~31)
            // 並將這些位元權值累加，形成一個單一的大整數。
            let encodedVotes = 0;
            selectedVotes.forEach(seat => {
                const bitIndex = parseInt(seat, 10) - 1; // 轉為位元偏移量：0 ~ 31
                // 使用 2 ** bitIndex，安全不溢位
                encodedVotes += Math.pow(2, bitIndex);
            });

            // 構建 URL 參數
            const params = new URLSearchParams();
            params.set('voter', currentVoter); 
            params.set('votes', encodedVotes.toString()); // 直接傳遞單一十進位整數
            
            const finalUrl = base + '?' + params.toString();
            urlInput.value = finalUrl;
        }

        // 複製網址功能
        function copySubmissionLink() {
            const urlInput = document.getElementById('generatedUrl');
            if (!urlInput.value) {
                showToast("請先選擇你的座號身份並勾選投票！", "fa-solid fa-triangle-exclamation text-amber-500");
                return;
            }

            // 支援 Iframe 相容的複製方式
            const tempInput = document.createElement("input");
            tempInput.value = urlInput.value;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            showToast("投票網址複製成功！請將它貼給老師。", "fa-solid fa-circle-check text-emerald-400");
        }

        // 自訂提示框
        function showToast(message, iconClass = "fa-solid fa-circle-check text-emerald-400") {
            const toast = document.getElementById('toast');
            const toastIcon = document.getElementById('toastIcon');
            const toastMsg = document.getElementById('toastMsg');

            toastIcon.innerHTML = `<i class="${iconClass}"></i>`;
            toastMsg.textContent = message;

            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // ==========================================
        // 5. 教師端二進位還原解碼邏輯
        // ==========================================
        function checkAndParseUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const voter = urlParams.get('voter');
            const votesEncoded = urlParams.get('votes');

            if (voter) {
                const panel = document.getElementById('teacherParserPanel');
                panel.classList.remove('hidden');

                // 顯示投票人資訊
                const voterStudent = studentsData.find(s => s.seatNo === voter);
                document.getElementById('parsedVoterSeat').textContent = voter;
                document.getElementById('parsedVoterName').textContent = voterStudent ? `${voterStudent.name} ` : "未知學生";

                // 解析被投票對象容器
                const listContainer = document.getElementById('parsedTargetList');
                listContainer.innerHTML = '';

                if (votesEncoded) {
                    const encodedNum = parseInt(votesEncoded, 10);
                    const votesArray = [];

                    if (!isNaN(encodedNum)) {
                        // 💡 32-bit Bitmask 解碼法：
                        // 使用無符號右移運算子 '>>>' 與 '& 1'，依序檢查 0 ~ 31 位元是否為 1
                        for (let i = 0; i < 32; i++) {
                            if (((encodedNum >>> i) & 1) === 1) {
                                const seatNo = String(i + 1).padStart(2, '0');
                                votesArray.push(seatNo);
                            }
                        }
                    }

                    document.getElementById('parsedVotesCount').textContent = votesArray.length;

                    if (votesArray.length > 0) {
                        votesArray.forEach(targetSeat => {
                            const targetStudent = studentsData.find(s => s.seatNo === targetSeat);
                            
                            const badge = document.createElement('span');
                            badge.className = 'inline-flex items-center gap-1 bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1.5 rounded-full border border-indigo-200';
                            badge.innerHTML = `
                                <span class="w-2 h-2 rounded-full bg-indigo-500 inline-block"></span>
                                #${targetSeat} ${targetStudent ? targetStudent.name : '未知'}
                            `;
                            listContainer.appendChild(badge);
                        });
                    } else {
                        listContainer.innerHTML = `<span class="text-xs text-slate-400 italic">此學生沒有投下任何一票。</span>`;
                    }
                } else {
                    document.getElementById('parsedVotesCount').textContent = "0";
                    listContainer.innerHTML = `<span class="text-xs text-slate-400 italic">此學生沒有投下任何一票。</span>`;
                }

                // 自動平滑滾動到解析看板
                panel.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // 教師清除並關閉解析模式
        function clearParser() {
            const cleanUrl = window.location.origin + window.location.pathname;
            window.location.href = cleanUrl;
        }
    </script>
</body>
